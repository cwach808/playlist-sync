[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "playlist-sync"
version = "0.1.0"
description = "Copy and keep public playlists in sync across Spotify, YouTube Music, and Amazon Music."
readme = "README.md"
license = "MIT"
authors = [{ name = "Christina Wachter" }]
requires-python = ">=3.11"
dependencies = [
    "google-auth-oauthlib>=1.2",
    "httpx>=0.27",
    "keyring>=25",
    "spotipy>=2.26.0",
    "typer>=0.12",
    "ytmusicapi>=1.10",
]

[project.urls]
Homepage = "https://cwach808.github.io/playlist-sync/"
Repository = "https://github.com/cwach808/playlist-sync"
Issues = "https://github.com/cwach808/playlist-sync/issues"

[project.optional-dependencies]
dev = ["bandit>=1.8", "pip-audit>=2.7", "pytest>=8", "ruff>=0.6"]

[project.scripts]
playlist-sync = "playlist_sync.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/playlist_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
